name: Skeet v2 NL points source verification
on:
  push:
    branches: [codex/skeet-v2-nl-points]
    paths: ['gamesense-csgo/**', '.github/workflows/skeet-v2-nl-points.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned CS:GO donor used by the prior recovery
        uses: actions/checkout@v4
        with:
          ref: 193bdb780b76402adb061cfb37b8eedcebba93cc
          path: donor
          sparse-checkout: neverlose-csgo/neverlose/bins/nl.bin
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install x86 emulator
        run: python -m pip install unicorn==2.1.4
      - name: Compile actual C++ module
        working-directory: gamesense-csgo
        run: |
          mkdir -p build reports
          g++ -std=c++17 -O2 -shared -fPIC -ffp-contract=off -fno-fast-math -Wall -Wextra -Werror tests/points_probe.cpp -o build/points_probe.so
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror tests/points_smoke.cpp -o build/points_smoke
          ./build/points_smoke
      - name: Compare geometry and scale with native NL x86
        working-directory: gamesense-csgo
        run: python tests/validate_points.py --donor ../donor/neverlose-csgo/neverlose/bins/nl.bin
      - name: Verify GS contract and baseline integrity
        working-directory: gamesense-csgo
        run: |
          python tests/validate_points_contract.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          for name,expected in json.loads(Path('archive_baseline.json').read_text())['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          print('Imported v2 source unchanged; new module is separate and not installed.')
          PY
      - name: Package C++ source and evidence
        working-directory: gamesense-csgo
        run: python package_points_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: skeet-v2-nl-points-source
          path: gamesense-csgo/build/skeet-v2-nl-points-source.zip
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile and execute x86 C++ smoke check
        shell: cmd
        working-directory: gamesense-csgo
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /O2 /fp:precise /W4 /WX tests\points_smoke.cpp /Fe:build\points_smoke.exe /Fo:build\points_smoke.obj
          if errorlevel 1 exit /b 1
          build\points_smoke.exe
  release:
    needs: [differential, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skeet-v2-nl-points-source
          path: dist
      - name: Publish verified source package
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/points-release-notes.md <<'EOF'
          CS:GO only. Reconstructed C++ head/body point geometry and point scale, with native x86 differential tests.

          This is a source and evidence package. The module is not installed in GS. Aim selection has not been ported. There is no new gameplay DLL or injector in this release.

          Head tests execute NL's native capsule intersection. Body tests replace the unavailable client.dll intersection with NL's internal intersection. The weapon fallback helper's result is an explicit test input.
          EOF
          tag="skeet-v2-nl-points-${SOURCE_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/skeet-v2-nl-points-source.zip --clobber
          else
            gh release create "$tag" dist/skeet-v2-nl-points-source.zip --target "$SOURCE_SHA" --prerelease --title 'Skeet v2: NL CS:GO points C++ recovery (not integrated)' --notes-file /tmp/points-release-notes.md
          fi
