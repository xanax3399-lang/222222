name: Skeet v2 NL points DLL
on:
  push:
    branches: [codex/skeet-v2-nl-points]
    paths: ['gamesense-csgo/**', '.github/workflows/skeet-v2-nl-points.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 193bdb780b76402adb061cfb37b8eedcebba93cc
          path: donor
          sparse-checkout: neverlose-csgo/neverlose/bins/nl.bin
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build and emulation tools
        run: python -m pip install -r gamesense-csgo/requirements-build.txt
      - name: Build Windows x86 DLL and matching injector
        run: python gamesense-csgo/build_windows.py
      - name: Compare NL math with original x86 donor
        working-directory: gamesense-csgo
        run: |
          g++ -std=c++17 -O2 -shared -fPIC -ffp-contract=off -fno-fast-math -Wall -Wextra -Werror tests/points_probe.cpp -o build/points_probe.so
          python tests/validate_points.py --donor ../donor/neverlose-csgo/neverlose/bins/nl.bin
      - name: Execute production bridge and actual GS consumer
        run: |
          python gamesense-csgo/tests/validate_points_bridge.py
          python gamesense-csgo/tests/validate_points_contract.py
      - name: Check retained loader, resource, animation and crash paths
        working-directory: gamesense-csgo
        run: |
          python tests/validate_core_image.py
          python tests/validate_hypotheses.py --donor ../donor/neverlose-csgo/neverlose/bins/nl.bin
          python tests/validate_hypotheses_startup.py
          python tests/validate_crash_report.py
          python tests/validate_launcher.py
          python tests/validate_resolver.py
          python tests/verify_points_release.py
      - name: Package DLL and injector
        run: python gamesense-csgo/package_windows_points.py
      - uses: actions/upload-artifact@v4
        with:
          name: skeet-v2-nl-points-windows
          path: gamesense-csgo/build/skeet-v2-nl-points-windows.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-evidence
          path: |
            gamesense-csgo/build/*.log
            gamesense-csgo/build/*validation.json
            gamesense-csgo/reports/*validation.json
      - name: Publish bounded compiler evidence
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python gamesense-csgo/publish_ci_status.py
  windows:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skeet-v2-nl-points-windows
          path: dist
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Extract actual compiled artifact
        shell: pwsh
        run: Expand-Archive dist/skeet-v2-nl-points-windows.zip -DestinationPath dist/runtime
      - name: Compile native loader probe
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /MT /W4 /WX gamesense-csgo\tests\dll_load_smoke.cpp /Fe:dist\dll_load_smoke.exe /Fo:dist\dll_load_smoke.obj
      - name: Load actual x86 DLL and inspect exports
        shell: cmd
        run: dist\dll_load_smoke.exe "%CD%\dist\runtime\skeet.dll"
      - name: Check injector argument handling
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & dist/runtime/injector.exe --mode invalid
          if ($LASTEXITCODE -ne 1) { throw 'Invalid mode was not rejected.' }
          & dist/runtime/injector.exe --diagnostics
          if ($LASTEXITCODE -ne 1) { throw 'Diagnostics should report that CS:GO is absent.' }
          $log = 'dist/runtime/module_diagnostics.log'
          if (!(Test-Path $log) -or (Get-Content $log -Raw) -notmatch 'No matching DLL') { throw 'Diagnostic file was not saved.' }
          Remove-Item $log
          '5' | & dist/runtime/injector.exe
          if ($LASTEXITCODE -ne 1 -or !(Test-Path $log)) { throw 'Menu 5 did not save diagnostics.' }
          exit 0
  release:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skeet-v2-nl-points-windows
          path: dist
      - name: Publish tested Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          unzip -q dist/skeet-v2-nl-points-windows.zip skeet.dll injector.exe -d dist
          cat > /tmp/points-release-notes.md <<'EOF'
          CS:GO Legacy 8802 only. Native GS candidates and the native primary center are now preserved; validated NL-derived points are appended. Start injector.exe and select 2 (NL points), or use --mode nl-points.

          Empty or rejected NL additions leave the original GS result intact. Minimum damage and hitchance are not lowered. Temporary storage holds up to 3 original + 7 NL points; the main list has 256 slots. Menu 5 saves module_diagnostics.log and waits for Enter in an interactive console.

          Three-matrix checks and GS damage/hitchance/aim selection remain active. The full NL resolver, weapon-dependent automatic scale and NL aim-selection logic are not ported.

          CI executes the compiled x86 bridge with real GS intersection/consumer functions and loads the actual DLL in Windows. Gameplay on a CS:GO map has not been tested.
          EOF
          tag="skeet-v2-nl-points-dll-${SOURCE_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/skeet-v2-nl-points-windows.zip dist/skeet.dll dist/injector.exe --clobber
          else
            gh release create "$tag" dist/skeet-v2-nl-points-windows.zip dist/skeet.dll dist/injector.exe --target "$SOURCE_SHA" --prerelease --title 'Skeet v2 / CS:GO / NL points DLL' --notes-file /tmp/points-release-notes.md
          fi
